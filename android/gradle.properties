org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Longer timeouts help when services.gradle.org is slow
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
android.useAndroidX=true
# Stronger R8 → higher Play Console Optimization / Obfuscation / Shrinking %
android.enableR8.fullMode=true
android.r8.ignoreDuplicateProguardConfigurationFiles=true
# Avoid "fileHashes already locked by this process" when IDE + Flutter build together
org.gradle.parallel=false
org.gradle.configureondemand=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
