name: reverse_image_search
description: Reverse Image Search — find visually similar images, exact matches, products, and sources.
publish_to: "none"
version: 1.0.1+3

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.8.0+1
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  permission_handler: ^11.4.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  in_app_purchase: ^3.3.1
  # Pin Android Billing Library 8.0.0 (0.5.5+ jumps to Billing 9.x).
  in_app_purchase_android: 0.5.3
  flutter_secure_storage: ^9.2.4
  font_awesome_flutter: ^11.0.0
  google_mobile_ads: ^7.0.0
  firebase_core: ^5.1.0
  firebase_analytics: ^13.0.0
  firebase_messaging: ^17.0.0
  in_app_review: ^2.0.12
  in_app_update: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Keep integration_test out of pubspec — it gets into GeneratedPluginRegistrant
  # and breaks Android Studio / release builds. Add temporarily when running:
  #   flutter test integration_test/

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/ads/
